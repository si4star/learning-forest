# Times Table Forest: daily reminder sender (a Cloudflare Worker, separate from the Pages site).
# Setup steps are in the README under "Daily reminders".
name = "tree-tables-reminders"
main = "index.js"
compatibility_date = "2025-09-01"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tree-tables"
database_id = "b2da684b-b66a-4ba4-a163-93e69ef20c12"

[vars]
SITE_URL = "https://tree-tables.pages.dev"

# Secret (not in this file): VAPID_PRIVATE_JWK — set in the dashboard under Settings → Variables and Secrets.
