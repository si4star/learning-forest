# Grow your times tables (The Learning Forest): daily reminder sender (a Cloudflare Worker, separate from the Pages site).
# Setup steps are in the README under "Daily reminders".
name = "learning-forest-reminders"
main = "index.js"
compatibility_date = "2025-09-01"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DATA"
database_id = "31dd9b0f-0aa9-49ed-9339-766278bcd56e"

[vars]
SITE_URL = "https://tree-tables.pages.dev"

# Secret (not in this file): VAPID_PRIVATE_JWK — set in the dashboard under Settings → Variables and Secrets.
